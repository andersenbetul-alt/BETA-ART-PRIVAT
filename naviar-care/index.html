dekoordinering",desc:"Én plan for familien: hvem gjør hva, når."},{code:"ANN",label:"Annet — beskriv oppgaven",desc:"Alle andre lavrisiko-oppgaver i hverdagen. Grensen er risiko, ikke listen."}],outside:"Utenfor tjenesten: medisinsk pleie, pengehåndtering, juridisk rådgivning og alt som krever autorisasjon — det hører til fagteamet eller det offentlige."},trygg:{kicker:"Trygghet",h2:"Du skal vite hvem som kommer.",lead:"Identitet, pålitelighet og kompetanse kontrolleres hver for seg — ingen stjerner eller poengsum kan erstatte dette.",cards:[{t:"Identitet",d:"Hjelperen identifiseres før oppdrag, og politiattest fremvises — vi lagrer den aldri."},{t:"Pålitelighet",d:"Referanser og tidligere oppdrag gir informasjon — men mange oppdrag uten avvik er ingen garanti. Vi følger opp hver gang."},{t:"Kompetanse for oppgaven",d:"Egnethet vurderes per oppgavetype. Medisinsk arbeid inngår ikke i tjenesten."}],money:"Del aldri BankID, PIN-kode eller bankkort med en hjelper. Ekstra arbeid og pris avtales alltid før arbeidet starter.",emergency:"Ved fare for liv ring 113 · brann 110 · akutt fare 112. NAVIAR CARE er ikke en nødtjeneste."},pilot:{kicker:"Pilotstatus",h2:"Hva er aktivt i piloten — og hva kommer",lead:"Vi lover bare det som virker i dag. Dette er status akkurat nå:",active:"Aktivt nå",coming:"Kommer senere",activeItems:["Behovskartlegging via skjema — et menneske svarer innen 24 timer","Manuell, kvalitetssikret matching — hver match godkjennes av en koordinator","Oppfølging etter gjennomført tjeneste"],comingItems:["Betaling på nett — aktiveres etter juridisk avklaring av arbeidsforhold og skatt","Automatisk booking med kalender","Innlogging og egen side"]},testi:{kicker:"Fra pilotbrukerne",h2:"Hva sier de som har prøvd",note:"* Sitater fra pilotbrukere. Navn og detaljer er anonymisert etter samtykke.",items:[{quote:"Jeg hadde prøvd å nå fastlegen i tre dager. Her fikk jeg svar fra en sykepleier innen 40 minutter. Det var det jeg trengte.",name:"Marianne L.",role:"Datter til omsorgstrengende forelder, Oslo"},{quote:"Trygdereglene er et mareritt å navigere alene. Sosionomen forklarte alt på én time — og vi fikk godkjent pleiepenger samme uke.",name:"Bjørn E.",role:"Pårørende, Bergen"},{quote:"Visste ikke at fullmakt og testamente var to vidt forskjellige ting. Juristen ryddet opp i all forvirringen på en halvtime.",name:"Kari og Tor S.",role:"Ektepar med foreldre i institusjon, Trondheim"}]},experts:{kicker:"Faglig støttelag",h2:"8 fagområder bak tjenesten",lead:"Når behovet krever autorisert kompetanse, står fagteamet klart — samme plattform, samme plan.",items:[{code:"SYK",label:"Sykepleier",desc:"Klinisk vurdering, medisinering og omsorg i hjemmet."},{code:"SOS",label:"Sosionom",desc:"Rettigheter, trygdeytelser og kommunale tjenester."},{code:"ERG",label:"Ergoterapeut",desc:"Tilpasning av bolig og daglige aktiviteter."},{code:"PSY",label:"Psykolog",desc:"Sorg, stress og psykisk helse for pårørende."},{code:"JUR",label:"Jurist",desc:"Fullmakt, testamente og pasientrettigheter."},{code:"ØKO",label:"Økonom",desc:"Pleiepengeberegning, arv og økonomi."},{code:"TEK",label:"Velferdsteknolog",desc:"Digitale hjelpemidler, GPS og trygghetsteknologi."},{code:"ERN",label:"Ernæringsfysiolog",desc:"Kosthold, matlyst og ernæringsplan."}]},fritid:{kicker:"Aktivitet og fellesskap",h2:"Fritidskontakt for eldre",lead:"Tilrettelagt fritid er en etablert kommunal tjenesteform. NAVIAR CARE leverer tilsvarende aktivitets- og deltakelsesstøtte: strukturert matching, kvalitetssikring og systematisk oppfølging — individuelt eller i gruppe.",cta1:"Få en fritidskontakt",cta2:"Bli fritidskontakt",points:["Match basert på interesser, egnethet og kommunikasjonsstil — godkjent av koordinator","Gjennomsnittlig 3–5 timer per uke, etter avtalt aktivitetsplan","Individuelt eller i gruppe: kultur, aktivitet, trening og sosial deltakelse","Politiattest fremvises før oppdrag — attesten lagres ikke"]},pricing:{kicker:"Priser",h2:"Enkel, forutsigbar prising",lead:"Start gratis i pilotperioden. Ingen kredittkort nødvendig.",badge:"Pårørendepiloten",note:"* Priser er eksempeltall fra pilotperioden og kan endres. Hjelperens timepris og plattformgebyret vises alltid hver for seg før du betaler. NAVIAR CARE Match — verifisert matching på sted, tid og interesser — inngår i både Start og Assist. Alle priser inkl. mva.",plans:[{name:"NAVIAR CARE Start",price:"Fast pris",unit:"",desc:"Pilotpakken: kartlegging og en personlig plan for hverdagen.",items:["Strukturert behovskartlegging","Behovssammendrag + personlig hverdagsplan","Henvisning til riktig støtte","Systematisk oppfølging etter 14 dager"],cta:"Book behovskartlegging",highlight:!0},{name:"NAVIAR CARE Assist",price:"250",unit:"per time",desc:"Alle typer lavrisiko-oppgaver — betal kun for timene du bruker.",items:["Alle lavrisiko-oppgaver, også utenfor kategoriene","Gebyr 15–25 % — vises før, trekkes ved fullført hjelp","Kontrollert hjelper, godkjent av deg","Ingen binding"],cta:"Be om hjelper",highlight:!1},{name:"NAVIAR CARE Partner",price:"Avtale",unit:"",desc:"For kommuner, BPA-leverandører og omsorgsvirksomheter.",items:["Behovsanalyse og tjenestedesign","Pilotledelse og koordinering","Kvalitets- og brukerrapport","Plattformlisens, SLA og faktura"],cta:"Ta kontakt",highlight:!1}],currency:"kr"},forSec:{k1:"For pårørende",h1:["Du skal ikke stå alene","med dette"],l1:["Svar fra riktig fagperson — ikke en generell liste","Tilgjengelig hverdager 08–20, responstid under én time","Ingen viderehenvisning. Ekspert svarer direkte.","Trygt og konfidensielt — GDPR-sertifisert"],c1:"Meld inn behov",principle:"Du kan foreslå hjelp og betale — men den som får hjelpen, godkjenner besøket og velger hva familien får se. Betaling gir ikke automatisk innsyn.",k2:"For fagpersoner",h2:["Bruk kompetansen din","der den trengs mest"],l2:["Fleksibelt arbeid på egne vilkår og tider","Direkte kontakt med pårørende som virkelig trenger deg","Ryddig plattform — bare fagsamtaler, ingen admin","Konkurransedyktig honorar og ukentlig utbetaling"],c2:"Søk som fagperson"},faq:{kicker:"Spørsmål og svar",h2:"Det du lurer på",items:[{q:"Kan jeg få samme hjelper hver gang?",a:"Ja — du kan ønske en fast hjelper når dere finner tonen. Personen må være ledig og kvalifisert for oppgaven, og vi sier alltid fra før vi foreslår en annen."},{q:"Hvem er ekspertene og hvordan godkjenner dere dem?",a:"Alle rådgivere har godkjent norsk autorisasjon innen sitt fagfelt. Vi verifiserer legitimasjon, arbeidserfaring (minimum 5 år klinisk) og referanser før de tas opp på plattformen. Under piloten gjennomfører vi i tillegg en testsamtale."},{q:"Hvor raskt svarer ekspertene?",a:"Målet er under én time på hverdager 08–20. I pilotperioden er gjennomsnittlig responstid 34 minutter (eksempeltall). Kveld og helg har lengre ventetid — vi viser alltid forventet tilgjengelighet før du sender spørsmål."},{q:"Hva skjer med informasjonen jeg deler?",a:"Vi lagrer aldri helseopplysninger knyttet til identifiserbar tredjeperson uten eksplisitt samtykke. Samtaler er kryptert og slettes på forespørsel. Naviar AS behandler data i henhold til GDPR og norsk personopplysningslov. Les hele personvernerklæringen vår."},{q:"Er dette det samme som å konsultere lege eller advokat?",a:"Nei — Naviar gir faglig veiledning, ikke juridisk rådgivning eller medisinsk behandling. Ekspertene hjelper deg å forstå situasjonen, kjenne rettighetene dine og ta informerte valg. Ved akutte helseproblemer ring alltid 113."},{q:"Hva er en fritidskontakt, og hvordan kvalitetssikres de?",a:"En fritidskontakt følger den eldre til kultur- og fritidsaktiviteter — individuelt eller i gruppe, i snitt 3–5 timer per uke. Fritidskontakter er 18 år eller eldre, viser politiattest før oppdrag (vi lagrer den aldri, kun at den er fremvist), og matches på felles interesser og personlighet. Hver match godkjennes av et menneske, aldri av en algoritme alene."},{q:"Kan jeg avbryte abonnementet når som helst?",a:"Ja, uten begrunnelse og uten ekstra kostnad. Abonnementet løper til slutten av inneværende periode og fornyes ikke. Du kan avbryte direkte i kontopanelet eller ved å sende oss en e-post."}]},finalCta:{h2:["Ikke la usikkerheten","vente til i morgen"],lead:"Meld inn behovet i dag — vi kartlegger, matcher og følger opp, når det passer dere.",placeholder:"din@epost.no",btn:"Meld meg på →",noBind:"Ingen binding · Avbryt når som helst",thanks:"Takk — du er registrert!",thanksSub:"Vi sender deg en e-post så snart du kan ta i bruk Naviar Care.",or:"Eller start med et spørsmål med én gang →"},footer:{tagline:"Praktisk hjelp. På dine premisser. Fagfolk, tjenester og familie samlet på ett sted.",area:"Pilotområde: Drammen og omegn",col1:"Tjenesten",col1Links:["Slik fungerer det","Fagområder","Priser","For fagpersoner"],col2:"Selskapet",col2Links:["Om oss","Personvern","Vilkår for bruk","Kontakt"],copyright:"© 2026 NAVIAR CARE · Drammen, Norge",wipe:"Slett lagrede data",gdpr:"GDPR-konform · Databehandling i EU"},cookie:{text:"Vi lagrer valgene dine kun i din nettleser. Sier du ja til alle, husker siden også hva du så på sist — så neste besøk starter der du slapp. Ingenting sendes ut av nettleseren, og du kan slette alt når som helst.",all:"Godta alle",necessary:"Kun nødvendige",label:"Informasjonskapsler"},modal:{kicker:"Behovskartlegging",title:"Meld inn behov",lead:"Vi kartlegger behovet og matcher riktig hjelper innen én virkedag.",name:"Navn *",namePh:"Ditt navn",email:"E-post *",emailPh:"din@epost.no",phone:"Telefon (valgfritt)",phonePh:"+47 000 00 000",topic:"Tjeneste",topicPh:"Velg tjeneste...",extraFaglig:"Faglig rådgivning (helse, jus, økonomi)",extraHjelper:"Jeg vil bli hjelper",extraVetikke:"Vet ikke ennå",situation:"Beskriv behovet *",situationPh:"Beskriv behovet — ikke diagnosen. F.eks.: «Mor trenger hjelp til å søke hjemmetjenester i Bergen.»",hint:"Ikke skriv diagnoser, medisinlister eller andre helseopplysninger her — eksperten spør om det som trengs, når det trengs.",privacy:"Vi ber ikke om diagnoser og samler ikke inn mer enn det som trengs for å koble deg til riktig ekspert. Henvendelsen behandles konfidensielt i henhold til GDPR, og du kan be om sletting når som helst.",submit:"Send henvendelse →",noBind:"Uforpliktende henvendelse — ingen binding.",close:"Lukk",thanks:"Takk,",done1:"Henvendelsen er registrert. Vi kontakter deg på",done2:"innen 24 timer for behovsavklaring og videre prosess.",pilotNote:"Dette er et pilotprogram. Responsene kan variere fra produksjonstid.",mailSubject:"Forespørsel fra"},next:{finishTopic:e=>`Fullf\xf8re foresp\xf8rselen om ${e.toLowerCase()}?`,finish:"Fullføre forespørselen din? Det tar under ett minutt",start:"Klar til å starte? Første time uten binding",cont:e=>`Fortsette med ${e.toLowerCase()}?`,how:"Se hvordan det fungerer — tre enkle steg"},navi:{open:"Spør Navi",close:"Lukk",name:"Navi",sub:"Automatisk assistent — ikke et menneske",ariaOpen:"Åpne chat med Navi, automatisk assistent",ariaClose:"Lukk chat",region:"Chat med Navi, automatisk assistent",inputLabel:"Skriv til Navi",inputPh:"Skriv et spørsmål...",send:"Send",intro:"Hei! Jeg er Navi — en automatisk assistent, ikke et menneske. Jeg svarer på det vanligste og setter deg videre til teamet. Ikke skriv helseopplysninger her. Hva lurer du på?",fallback:"Det kan jeg ikke svare godt på ennå. Vil du sende spørsmålet til teamet? Et menneske svarer innen 24 timer — trykk «Snakk med et menneske».",quick:["Hva koster det?","Hvordan fungerer det?","Bli hjelper","Snakk med et menneske"],humanBtn:"Snakk med et menneske",answers:[{keys:/pris|koste|kr|betal|gebyr/i,text:"NAVIAR CARE Start er pilotpakken til fast pris: behovssamtale, personlig plan og oppfølging etter 14 dager. NAVIAR CARE Assist koster fra 250 kr per time (eksempelpris), pluss plattformgebyr på 15–25 % som alltid vises før du betaler. Vil du booke en behovskartlegging?"},{keys:/fungerer|hvordan|steg|virker|metode/i,text:"Vi arbeider i fem steg: kartlegging av behovet, behovsavklaring, en konkret hverdagsplan, kvalitetssikret match (alltid godkjent av et menneske) og oppfølging etter gjennomført tjeneste. Skal jeg åpne behovskartleggingen?"},{keys:/hjelper|jobb|søk|arbeid|bli/i,text:"Så fint at du vil bli hjelper! Du må være 18+, vise politiattest (vi lagrer den aldri) og sette dine egne tilgjengelighetstider. Jeg kan åpne søknadsskjemaet for deg.",topic:p},{keys:/fritid|tur|aktivitet|følge|svøm/i,text:"Fritidskontakt følger dine nærmeste til aktiviteter — i snitt 3–5 timer i uken, individuelt eller i gruppe, matchet på interesser. Vil du sende en forespørsel?",topic:"Tur og aktivitet"},{keys:/handl|ærend|butikk|apotek|post/i,text:"Vi hjelper med dagligvarer, apotek, post og småærend — betalt per time. Skal jeg åpne forespørselen med riktig tjeneste valgt?",topic:"Handling og ærend"},{keys:/annet|andre ting|noe annet|spesiell/i,text:"Vi hjelper med alt som er lavrisiko — grensen er risiko, ikke en liste. Beskriv oppgaven, så vurderer en koordinator den. Utenfor: medisinsk pleie, pengehåndtering, juridiske råd og alt som krever autorisasjon.",topic:"Annet — beskriv oppgaven"},{keys:/trygg|sikker|attest|personvern|gdpr|data/i,text:"Alle hjelpere viser politiattest før oppdrag (vi lagrer den aldri), matching godkjennes av et menneske, og vi ber aldri om diagnoser eller helseopplysninger. Alt du skriver her blir i nettleseren din."},{keys:/menneske|person|ringe|kontakt|snakke/i,text:"Selvsagt — send inn skjemaet, så tar et ekte menneske kontakt innen 24 timer. Jeg åpner det for deg."}]}},en:{nav:{tjenester:"Services",how:"How it works",fritid:"Activity companion",priser:"Pricing",fag:"For professionals",cta:"Get started →",menu:"Menu"},hero:{badge:"Pilot programme — active now",h1:["Your home.","Your life.","A little help along the way."],lead:"Groceries. A walk outside. Help with the phone. NAVIAR CARE is practical help for people who want to live at home and make their own choices — with the need mapped, a quality-assured helper and the total price agreed before anything is confirmed.",cta:"Book a needs assessment",how:"How we work",back:"Welcome back —",gdpr:"We never store health data without your explicit consent · GDPR-safe",area:"Pilot area: Drammen and surroundings — expanding step by step",stats:[{val:"89%",label:"got an answer\nwithin 60 min"},{val:"8",label:"professional fields\non the platform"},{val:"4.8",label:"average rating\nfrom users"}],statsNote:"* Example figures from the pilot period",cardTitle:"Always agreed before the visit",cardItems:["What will be done","Who is coming","When — and for how long","The total price, before you approve","Who gets to see what"],cardNote:"Paying does not automatically give access.",cardInput:"Tell us what you need..."},promise:{items:[{t:"Your choice",d:"What you need, and who gets to know."},{t:"Price first",d:"The total price is agreed before an appointment is confirmed."},{t:"People, nearby",d:"Request a familiar helper when you find a good fit."}]},how:{kicker:"How it works",h2:"From need to follow-up — in five steps",steps:[{n:"1",title:"Mapping",body:"We map needs, wishes and daily routines — structured, with no application and no medical record."},{n:"2",title:"Clarifying the need",body:"Together we clarify the goal behind the need: activity, coping and social participation — not just the task."},{n:"3",title:"Everyday plan",body:"You receive a concrete plan: activities, support hours, transport and family coordination."},{n:"4",title:"Quality-assured match",body:"A coordinator matches a helper on competence, suitability, interests and availability — you approve before the start."},{n:"5",title:"Delivery and follow-up",body:"The service is delivered at the agreed time with the full price shown. We follow up on quality, safety and further needs."}]},cats:{kicker:"Help hour by hour",h2:"All low-risk help — hour by hour",lead:"Everyday assistance delivered by quality-assured helpers. The scope is defined by risk — tasks outside the categories are assessed individually by a coordinator. The fee is shown before you confirm and charged when the service is completed.",last:"LAST VIEWED",items:[{code:"SOS",label:"Social visits",desc:"Visits, conversation and company in everyday life."},{code:"TUR",label:"Walks and activities",desc:"Walks and activities in the neighbourhood."},{code:"ÆRE",label:"Shopping and errands",desc:"Groceries, pharmacy, post and small errands."},{code:"HUS",label:"Light housework",desc:"Light tasks at home — carrying, tidying, small fixes."},{code:"TRA",label:"Transport and appointments",desc:"Accompaniment to the doctor, hairdresser or other appointments."},{code:"TRE",label:"Exercise companion",desc:"Accompaniment to swimming, exercise and organised activities."},{code:"DIG",label:"Phone and tablet help",desc:"Video calls, photos and simple settings."},{code:"HAG",label:"Garden and seasonal tasks",desc:"Watering, sweeping and light outdoor work."},{code:"KOO",label:"Family coordination",desc:"One plan for the family: who does what, and when."},{code:"ANN",label:"Other — describe the task",desc:"Any other low-risk everyday task. The limit is risk, not the list."}],outside:"Outside the service: medical care, handling money, legal advice and anything that requires authorisation — that belongs to the professional team or public services."},trygg:{kicker:"Safety",h2:"Know who is coming.",lead:"Identity, reliability and competence are checked separately — no star rating or score can replace this.",cards:[{t:"Identity",d:"The helper is identified before assignments, and a police certificate is shown — we never store it."},{t:"Reliability",d:"References and previous assignments provide information — but many assignments without incidents are no guarantee. We follow up every time."},{t:"Competence for the task",d:"Suitability is assessed per task type. Medical work is not part of the service."}],money:"Never share BankID, PIN codes or bank cards with a helper. Extra work and its price are always agreed before the work starts.",emergency:"For danger to life call 113 · fire 110 · immediate danger 112. NAVIAR CARE is not an emergency service."},pilot:{kicker:"Pilot status",h2:"What is active in the pilot — and what is coming",lead:"We only promise what works today. This is the status right now:",active:"Active now",coming:"Coming later",activeItems:["Needs assessment via the form — a human replies within 24 hours","Manual, quality-assured matching — every match is approved by a coordinator","Follow-up after each completed service"],comingItems:["Online payment — activated after legal clarification of employment and tax","Automatic booking with a calendar","Login and personal page"]},testi:{kicker:"From pilot users",h2:"What people who tried it say",note:"* Quotes from pilot users. Names and details anonymised with consent.",items:[{quote:"I had tried to reach the GP for three days. Here I got an answer from a nurse within 40 minutes. That was what I needed.",name:"Marianne L.",role:"Daughter of a parent needing care, Oslo"},{quote:"The benefit rules are a nightmare to navigate alone. The social worker explained everything in one hour — and our care benefit was approved the same week.",name:"Bjørn E.",role:"Family carer, Bergen"},{quote:"I did not know that a power of attorney and a will were two completely different things. The lawyer cleared up all the confusion in half an hour.",name:"Kari and Tor S.",role:"Couple with parents in care, Trondheim"}]},experts:{kicker:"Professional support team",h2:"8 professional fields behind the service",lead:"When the need requires authorised competence, the professional team is ready — same platform, same plan.",items:[{code:"SYK",label:"Nurse",desc:"Clinical assessment, medication and care at home."},{code:"SOS",label:"Social worker",desc:"Rights, benefits and municipal services."},{code:"ERG",label:"Occupational therapist",desc:"Adapting the home and daily activities."},{code:"PSY",label:"Psychologist",desc:"Grief, stress and mental health for family carers."},{code:"JUR",label:"Lawyer",desc:"Power of attorney, wills and patient rights."},{code:"ØKO",label:"Economist",desc:"Care benefit calculations, inheritance and finances."},{code:"TEK",label:"Welfare technologist",desc:"Digital aids, GPS and safety technology."},{code:"ERN",label:"Nutritionist",desc:"Diet, appetite and nutrition plans."}]},fritid:{kicker:"Activity and community",h2:"Activity companion for the elderly",lead:"Supported leisure is an established municipal service in Norway. NAVIAR CARE delivers the same kind of activity and participation support: structured matching, quality assurance and systematic follow-up — individually or in groups.",cta1:"Get an activity companion",cta2:"Become a companion",points:["Matched on interests, suitability and communication style — approved by a coordinator","On average 3–5 hours per week, following an agreed activity plan","Individually or in groups: culture, activity, exercise and social participation","Police certificate shown before assignments — never stored by us"]},pricing:{kicker:"Pricing",h2:"Simple, predictable pricing",lead:"Start free during the pilot period. No credit card required.",badge:"Family carer pilot",note:"* Prices are example figures from the pilot period and may change. The helper's hourly rate and the platform fee are always shown separately before you pay. NAVIAR CARE Match — verified matching on place, time and interests — is included in both Start and Assist. All prices incl. VAT.",plans:[{name:"NAVIAR CARE Start",price:"Fixed price",unit:"",desc:"The pilot package: needs assessment and a personal everyday plan.",items:["Structured needs assessment","Needs summary + personal everyday plan","Referral to the right support","Systematic follow-up after 14 days"],cta:"Book a needs assessment",highlight:!0},{name:"NAVIAR CARE Assist",price:"250",unit:"per hour",desc:"All low-risk tasks — pay only for the hours you use.",items:["All low-risk tasks, also outside the categories","Fee 15–25% — shown first, charged on completed help","Vetted helper, approved by you","No commitment"],cta:"Request a helper",highlight:!1},{name:"NAVIAR CARE Partner",price:"Agreement",unit:"",desc:"For municipalities, BPA providers and care organisations.",items:["Needs analysis and service design","Pilot management and coordination","Quality and user report","Platform licence, SLA and invoicing"],cta:"Contact us",highlight:!1}],currency:"NOK"},forSec:{k1:"For family carers",h1:["You should not stand alone","with this"],l1:["Answers from the right professional — not a generic list","Available weekdays 08–20, response within one hour","No forwarding. The expert answers directly.","Safe and confidential — GDPR-certified"],c1:"Tell us your need",principle:"You can suggest help and pay — but the person receiving help approves the visit and chooses what the family gets to see. Paying does not automatically give access.",k2:"For professionals",h2:["Use your competence","where it is needed most"],l2:["Flexible work on your own terms and hours","Direct contact with families who really need you","Clean platform — only professional conversations, no admin","Competitive pay and weekly payout"],c2:"Apply as a professional"},faq:{kicker:"Questions and answers",h2:"What you may wonder about",items:[{q:"Can I have the same helper every time?",a:"Yes — you can request a familiar helper when you find a good fit. The person must be available and qualified for the task, and we always tell you before proposing someone else."},{q:"Who are the experts and how do you approve them?",a:"All advisers hold approved Norwegian authorisation in their field. We verify credentials, work experience (minimum 5 years clinical) and references before they join the platform. During the pilot we also conduct a test conversation."},{q:"How fast do the experts answer?",a:"The goal is under one hour on weekdays 08–20. In the pilot period the average response time is 34 minutes (example figure). Evenings and weekends have longer waits — we always show expected availability before you send a question."},{q:"What happens to the information I share?",a:"We never store health data linked to an identifiable third person without explicit consent. Conversations are encrypted and deleted on request. Naviar processes data in accordance with the GDPR and Norwegian privacy law. Read our full privacy statement."},{q:"Is this the same as consulting a doctor or a lawyer?",a:"No — Naviar provides professional guidance, not legal advice or medical treatment. The experts help you understand the situation, know your rights and make informed choices. For acute health problems always call 113."},{q:"What is an activity companion, and how are they vetted?",a:"An activity companion accompanies the elderly person to cultural and leisure activities — individually or in a group, on average 3–5 hours per week. Companions are 18 or older, show a police certificate before assignments (we never store it, only that it was shown), and are matched on shared interests and personality. Every match is approved by a human, never by an algorithm alone."},{q:"Can I cancel at any time?",a:"Yes, without giving a reason and at no extra cost. The subscription runs to the end of the current period and is not renewed. You can cancel directly or by sending us an email."}]},finalCta:{h2:["Do not let the uncertainty","wait until tomorrow"],lead:"Tell us your need today — we map, match and follow up, when it suits you.",placeholder:"you@email.com",btn:"Sign me up →",noBind:"No commitment · Cancel at any time",thanks:"Thank you — you are registered!",thanksSub:"We will email you as soon as you can start using Naviar Care.",or:"Or start with a question right away →"},footer:{tagline:"Practical help. On your terms. Professionals, services and family gathered in one place.",area:"Pilot area: Drammen and surroundings",col1:"The service",col1Links:["How it works","Professional fields","Pricing","For professionals"],col2:"Company",col2Links:["About us","Privacy","Terms of use","Contact"],copyright:"© 2026 NAVIAR CARE · Drammen, Norway",wipe:"Delete stored data",gdpr:"GDPR-compliant · Data processing in the EU"},cookie:{text:"We store your choices only in your browser. If you accept all, the site also remembers what you looked at last — so your next visit starts where you left off. Nothing leaves your browser, and you can delete everything at any time.",all:"Accept all",necessary:"Only necessary",label:"Cookies"},modal:{kicker:"Needs assessment",title:"Tell us your need",lead:"We map the need and match the right helper within one working day.",name:"Name *",namePh:"Your name",email:"Email *",emailPh:"you@email.com",phone:"Phone (optional)",phonePh:"+47 000 00 000",topic:"Service",topicPh:"Choose a service...",extraFaglig:"Professional advice (health, law, finances)",extraHjelper:"I want to become a helper",extraVetikke:"Not sure yet",situation:"Describe the need *",situationPh:'Describe the need — not the diagnosis. E.g.: "My mother needs help applying for home care in Bergen."',hint:"Do not write diagnoses, medication lists or other health data here — the expert asks for what is needed, when it is needed.",privacy:"We do not ask for diagnoses and collect no more than what is needed to connect you to the right expert. Your request is handled confidentially under the GDPR, and you can request deletion at any time.",submit:"Send request →",noBind:"Non-binding request — no commitment.",close:"Close",thanks:"Thank you,",done1:"Your request is registered. We will contact you at",done2:"within 24 hours to clarify the need and the next steps.",pilotNote:"This is a pilot programme. Response times may differ from production.",mailSubject:"Request from"},next:{finishTopic:e=>`Finish your request about ${e.toLowerCase()}?`,finish:"Finish your request? It takes less than a minute",start:"Ready to start? First hour with no commitment",cont:e=>`Continue with ${e.toLowerCase()}?`,how:"See how it works — in a few simple steps"},navi:{open:"Ask Navi",close:"Close",name:"Navi",sub:"Automatic assistant — not a human",ariaOpen:"Open chat with Navi, automatic assistant",ariaClose:"Close chat",region:"Chat with Navi, automatic assistant",inputLabel:"Write to Navi",inputPh:"Type a question...",send:"Send",intro:"Hi! I am Navi — an automatic assistant, not a human. I answer the most common questions and pass you on to the team. Please do not write health information here. What would you like to know?",fallback:'I cannot answer that well yet. Would you like to send the question to the team? A human replies within 24 hours — press "Talk to a human".',quick:["What does it cost?","How does it work?","Become a helper","Talk to a human"],humanBtn:"Talk to a human",answers:[{keys:/price|cost|pay|fee|nok/i,text:"NAVIAR CARE Start is the pilot package at a fixed price: a needs conversation, a personal plan and follow-up after 14 days. NAVIAR CARE Assist costs from 250 NOK per hour (example price), plus a platform fee of 15–25% always shown before you pay. Would you like to book a needs assessment?"},{keys:/work|how|step|method/i,text:"We work in five steps: mapping the need, clarifying it, a concrete everyday plan, a quality-assured match (always approved by a human) and follow-up after the service. Shall I open the needs assessment?"},{keys:/helper|job|apply|become/i,text:"Great that you want to become a helper! You must be 18+, show a police certificate (we never store it) and set your own availability. I can open the application form for you.",topic:p},{keys:/leisure|walk|activity|companion|swim/i,text:"An activity companion accompanies your loved one to activities — on average 3–5 hours a week, individually or in a group, matched on interests. Would you like to send a request?",topic:"Tur og aktivitet"},{keys:/shop|errand|grocer|pharmac|post/i,text:"We help with groceries, pharmacy, post and small errands — paid per hour. Shall I open the request with the right service selected?",topic:"Handling og ærend"},{keys:/other|something else|special/i,text:"We help with anything low-risk — the limit is risk, not a list. Describe the task and a coordinator will assess it. Outside the service: medical care, handling money, legal advice and anything requiring authorisation.",topic:"Annet — beskriv oppgaven"},{keys:/safe|secure|certificate|privacy|gdpr|data/i,text:"All helpers show a police certificate before assignments (we never store it), matching is approved by a human, and we never ask for diagnoses or health data. Everything you write here stays in your browser."},{keys:/human|person|call|contact|talk/i,text:"Of course — send in the form and a real human will contact you within 24 hours. I will open it for you."}]}},tr:{nav:{tjenester:"Hizmetler",how:"Nasıl çalışır",fritid:"Aktivite arkadaşı",priser:"Fiyatlar",fag:"Uzmanlar için",cta:"Hemen başla →",menu:"Menü"},hero:{badge:"Pilot program — şu an aktif",h1:["Eviniz.","Hayatınız.","Günlük işlerde yanınızdayız."],lead:"Bir market alışverişi. Kısa bir yürüyüş. Telefonla bir yardım. NAVIAR CARE, evinde yaşamak ve kendi kararlarını vermek isteyenlere pratik destektir — ihtiyaç belirlenir, kalite güvenceli yardımcı eşleştirilir ve toplam fiyat her şey onaylanmadan önce netleşir.",cta:"İhtiyaç görüşmesi planla",how:"Nasıl çalışıyoruz",back:"Tekrar hoş geldin —",gdpr:"Açık onayın olmadan sağlık bilgisi asla saklamayız · GDPR güvencesi",area:"Pilot bölge: Drammen ve çevresi — adım adım genişliyor",stats:[{val:"89%",label:"60 dk içinde\nyanıt aldı"},{val:"8",label:"uzmanlık alanı\nplatformda"},{val:"4.8",label:"kullanıcı\npuan ortalaması"}],statsNote:"* Pilot dönemden örnek rakamlar",cardTitle:"Ziyaretten önce her zaman netleşir",cardItems:["Ne yapılacağı","Kimin geleceği","Ne zaman — ve ne kadar süre","Toplam fiyat, siz onaylamadan önce","Kimin neyi görebileceği"],cardNote:"Ödeme yapmak otomatik bilgi erişimi sağlamaz.",cardInput:"Neye ihtiyacınız olduğunu anlatın..."},promise:{items:[{t:"Karar sizin",d:"İhtiyacınıza ve kimin bilgi alacağına siz karar verirsiniz."},{t:"Önce fiyat",d:"Toplam fiyat, randevu onaylanmadan önce netleşir."},{t:"Yakınınızdaki insanlar",d:"Anlaştığınız yardımcıyla devam etmeyi isteyebilirsiniz."}]},how:{kicker:"Nasıl çalışır",h2:"İhtiyaçtan takibe — beş adımda",steps:[{n:"1",title:"İhtiyaç haritası",body:"İhtiyaçları, istekleri ve günlük rutinleri belirliyoruz — yapılandırılmış, başvurusuz ve sağlık dosyası olmadan."},{n:"2",title:"İhtiyacın netleşmesi",body:"İhtiyacın arkasındaki hedefi birlikte netleştiriyoruz: aktivite, öz güven ve sosyal katılım — yalnızca görev değil."},{n:"3",title:"Günlük yaşam planı",body:"Somut bir plan alırsınız: aktiviteler, destek saatleri, ulaşım ve aile koordinasyonu."},{n:"4",title:"Kalite güvenceli eşleştirme",body:"Koordinatör; yetkinlik, uygunluk, ilgi alanları ve müsaitliğe göre yardımcı eşleştirir — başlamadan önce siz onaylarsınız."},{n:"5",title:"Uygulama ve takip",body:"Hizmet, fiyatı önceden eksiksiz gösterilerek kararlaştırılan saatte yapılır. Kaliteyi, güvenliği ve sonraki ihtiyaçları takip ederiz."}]},cats:{kicker:"Saat saat yardım",h2:"Tüm düşük riskli yardımlar — saat saat",lead:"Kalite güvenceli yardımcılarla günlük yaşam desteği. Kapsamın sınırı risktir — kategoriler dışındaki görevleri koordinatör tek tek değerlendirir. Ücret onaydan önce gösterilir ve hizmet tamamlanınca tahsil edilir.",last:"SON BAKILAN",items:[{code:"SOS",label:"Sosyal ziyaret",desc:"Günlük yaşamda ziyaret, sohbet ve arkadaşlık."},{code:"TUR",label:"Yürüyüş ve aktivite",desc:"Yakın çevrede yürüyüş ve aktiviteler."},{code:"ÆRE",label:"Alışveriş ve işler",desc:"Market, eczane, posta ve küçük işler."},{code:"HUS",label:"Basit ev işleri",desc:"Evde hafif işler — taşıma, toplama, küçük tamirler."},{code:"TRA",label:"Ulaşım ve randevular",desc:"Doktora, kuaföre veya diğer randevulara eşlik."},{code:"TRE",label:"Egzersiz eşliği",desc:"Yüzme, spor ve organize aktivitelere eşlik."},{code:"DIG",label:"Telefon ve tablet desteği",desc:"Görüntülü arama, fotoğraflar ve basit ayarlar."},{code:"HAG",label:"Bahçe ve mevsimlik işler",desc:"Sulama, süpürme ve dışarıda hafif işler."},{code:"KOO",label:"Aile koordinasyonu",desc:"Aile için tek plan: kim, neyi, ne zaman yapar."},{code:"ANN",label:"Diğer — görevi tarif edin",desc:"Günlük yaşamdaki diğer tüm düşük riskli görevler. Sınır risktir, liste değil."}],outside:"Hizmet dışı: tıbbi bakım, para işlemleri, hukuki danışmanlık ve yetki gerektiren her iş — bunlar uzman ekibin veya kamunun alanıdır."},trygg:{kicker:"Güvenlik",h2:"Kimin geleceğini bilmelisiniz.",lead:"Kimlik, güvenilirlik ve yetkinlik ayrı ayrı kontrol edilir — hiçbir yıldız puanı bunun yerine geçmez.",cards:[{t:"Kimlik",d:"Yardımcının kimliği görev öncesi doğrulanır ve adli sicil belgesi gösterilir — belgeyi asla saklamayız."},{t:"Güvenilirlik",d:"Referanslar ve önceki görevler bilgi verir — ama sorunsuz geçen çok sayıda görev garanti değildir. Her seferinde takip ederiz."},{t:"İşe uygun yetkinlik",d:"Uygunluk her görev türü için ayrı değerlendirilir. Tıbbi işler hizmete dahil değildir."}],money:"BankID, PIN kodu veya banka kartınızı yardımcıyla asla paylaşmayın. Ek iş ve ücreti her zaman iş başlamadan önce kararlaştırılır.",emergency:"Hayati tehlikede 113 · yangında 110 · acil tehlikede 112. NAVIAR CARE bir acil yardım hizmeti değildir."},pilot:{kicker:"Pilot durumu",h2:"Pilotta ne aktif — ne yolda",lead:"Yalnızca bugün çalışanı vaat ediyoruz. Şu anki durum:",active:"Şu an aktif",coming:"Daha sonra",activeItems:["Form üzerinden ihtiyaç görüşmesi — 24 saat içinde bir insan yanıtlar","Manuel, kalite güvenceli eşleştirme — her eşleşmeyi koordinatör onaylar","Tamamlanan her hizmet sonrası takip"],comingItems:["Online ödeme — çalışma statüsü ve vergi konularının hukuki netleşmesinden sonra açılacak","Takvimli otomatik rezervasyon","Giriş ve kişisel sayfa"]},testi:{kicker:"Pilot kullanıcılarından",h2:"Deneyenler ne diyor",note:"* Pilot kullanıcı alıntıları. İsimler ve ayrıntılar onayla anonimleştirildi.",items:[{quote:"Üç gündür aile hekimine ulaşmaya çalışıyordum. Burada 40 dakika içinde bir hemşireden yanıt aldım. İhtiyacım olan tam buydu.",name:"Marianne L.",role:"Bakıma muhtaç ebeveyn kızı, Oslo"},{quote:"Sosyal yardım kuralları tek başına içinden çıkılmaz bir labirent. Sosyal hizmet uzmanı her şeyi bir saatte anlattı — bakım ödeneğimiz aynı hafta onaylandı.",name:"Bjørn E.",role:"Yakın bakım veren, Bergen"},{quote:"Vekaletname ile vasiyetin bambaşka iki şey olduğunu bilmiyordum. Avukat yarım saatte tüm karışıklığı çözdü.",name:"Kari ve Tor S.",role:"Ebeveynleri kurumda olan çift, Trondheim"}]},experts:{kicker:"Uzman destek ekibi",h2:"Hizmetin arkasında 8 uzmanlık alanı",lead:"İhtiyaç yetkili uzmanlık gerektirdiğinde uzman ekip hazır — aynı platform, aynı plan.",items:[{code:"SYK",label:"Hemşire",desc:"Klinik değerlendirme, ilaç düzeni ve evde bakım."},{code:"SOS",label:"Sosyal hizmet uzmanı",desc:"Haklar, sosyal ödemeler ve belediye hizmetleri."},{code:"ERG",label:"Ergoterapist",desc:"Konut ve günlük aktivitelerin uyarlanması."},{code:"PSY",label:"Psikolog",desc:"Yakınlar için yas, stres ve ruh sağlığı."},{code:"JUR",label:"Hukukçu",desc:"Vekalet, vasiyet ve hasta hakları."},{code:"ØKO",label:"Ekonomist",desc:"Bakım ödeneği hesabı, miras ve ekonomi."},{code:"TEK",label:"Refah teknoloğu",desc:"Dijital yardımcılar, GPS ve güvenlik teknolojisi."},{code:"ERN",label:"Beslenme uzmanı",desc:"Beslenme, iştah ve beslenme planı."}]},fritid:{kicker:"Aktivite ve topluluk",h2:"Yaşlılar için aktivite arkadaşı",lead:"Destekli boş zaman, Norveç'te yerleşik bir belediye hizmetidir. NAVIAR CARE aynı tür aktivite ve katılım desteğini sunar: yapılandırılmış eşleştirme, kalite güvencesi ve sistematik takip — bireysel veya grup halinde.",cta1:"Aktivite arkadaşı iste",cta2:"Aktivite arkadaşı ol",points:["İlgi alanı, uygunluk ve iletişim tarzına göre eşleştirme — koordinatör onaylı","Kararlaştırılan aktivite planına göre haftada ortalama 3–5 saat","Bireysel veya grupça: kültür, aktivite, egzersiz ve sosyal katılım","Görev öncesi adli sicil belgesi gösterilir — belge asla saklanmaz"]},pricing:{kicker:"Fiyatlar",h2:"Basit, öngörülebilir fiyatlandırma",lead:"Pilot döneminde ücretsiz başlayın. Kredi kartı gerekmez.",badge:"Yakın bakım pilotu",note:"* Fiyatlar pilot dönemden örnek rakamlardır ve değişebilir. Yardımcının saat ücreti ile platform ücreti ödemeden önce her zaman ayrı ayrı gösterilir. NAVIAR CARE Match — yer, zaman ve ilgiye göre doğrulanmış eşleştirme — hem Start hem Assist'e dahildir. Fiyatlara KDV dahildir.",plans:[{name:"NAVIAR CARE Start",price:"Sabit fiyat",unit:"",desc:"Pilot paketi: ihtiyaç görüşmesi ve kişisel günlük yaşam planı.",items:["Yapılandırılmış ihtiyaç görüşmesi","İhtiyaç özeti + kişisel günlük plan","Doğru desteğe yönlendirme","14 gün sonra sistematik takip"],cta:"İhtiyaç görüşmesi planla",highlight:!0},{name:"NAVIAR CARE Assist",price:"250",unit:"saat başı",desc:"Tüm düşük riskli görevler — yalnız kullandığınız saatleri ödersiniz.",items:["Kategori dışındakiler dahil tüm düşük riskli görevler","Ücret %15–25 — önce gösterilir, hizmet tamamlanınca alınır","Kontrollü yardımcı, sizin onayınızla","Taahhüt yok"],cta:"Yardımcı iste",highlight:!1},{name:"NAVIAR CARE Partner",price:"Anlaşma",unit:"",desc:"Belediyeler, BPA sağlayıcıları ve bakım kuruluşları için.",items:["İhtiyaç analizi ve hizmet tasarımı","Pilot yönetimi ve koordinasyon","Kalite ve kullanıcı raporu","Platform lisansı, SLA ve fatura"],cta:"İletişime geç",highlight:!1}],currency:"kr"},forSec:{k1:"Yakınlar için",h1:["Bu yükle tek başına","kalmamalısın"],l1:["Doğru uzmandan yanıt — genel liste değil","Hafta içi 08–20 ulaşılabilir, yanıt bir saatin altında","Yönlendirme yok; uzman doğrudan yanıtlar.","Güvenli ve gizli — GDPR sertifikalı"],c1:"İhtiyacını bildir",principle:"Yardım önerebilir ve ücretini ödeyebilirsiniz — ama ziyareti yardımı alan kişi onaylar ve ailenin neyi göreceğini o seçer. Ödeme yapmak otomatik bilgi erişimi sağlamaz.",k2:"Uzmanlar için",h2:["Yetkinliğini en çok","gereken yerde kullan"],l2:["Kendi koşullarında ve saatlerinde esnek çalışma","Sana gerçekten ihtiyacı olan ailelerle doğrudan iletişim","Düzenli platform — yalnız uzman görüşmeleri, evrak işi yok","Rekabetçi ücret ve haftalık ödeme"],c2:"Uzman olarak başvur"},faq:{kicker:"Soru ve yanıtlar",h2:"Merak ettikleriniz",items:[{q:"Her seferinde aynı yardımcıyı alabilir miyim?",a:"Evet — anlaştığınızda sabit bir yardımcı isteyebilirsiniz. Kişinin müsait ve görev için yetkin olması gerekir; başka birini önermeden önce size her zaman haber veririz."},{q:"Uzmanlar kim ve onları nasıl onaylıyorsunuz?",a:"Tüm danışmanların kendi alanında onaylı Norveç yetki belgesi vardır. Platforma alınmadan önce belge, iş deneyimi (en az 5 yıl klinik) ve referanslar doğrulanır. Pilot sırasında ayrıca bir test görüşmesi yapıyoruz."},{q:"Uzmanlar ne kadar hızlı yanıtlıyor?",a:"Hedef, hafta içi 08–20 arasında bir saatin altı. Pilot döneminde ortalama yanıt süresi 34 dakika (örnek rakam). Akşam ve hafta sonu bekleme daha uzundur — soru göndermeden önce beklenen müsaitliği her zaman gösteririz."},{q:"Paylaştığım bilgilere ne oluyor?",a:"Kimliği belirlenebilir üçüncü kişilere ait sağlık bilgilerini açık onay olmadan asla saklamayız. Görüşmeler şifrelidir ve talep üzerine silinir. Naviar, verileri GDPR'a ve Norveç kişisel veri yasasına uygun işler. Gizlilik bildirimimizin tamamını okuyabilirsiniz."},{q:"Bu, doktora veya avukata danışmakla aynı şey mi?",a:"Hayır — Naviar mesleki rehberlik sunar; hukuki danışmanlık veya tıbbi tedavi değildir. Uzmanlar durumu anlamanıza, haklarınızı bilmenize ve bilinçli seçim yapmanıza yardım eder. Acil sağlık sorunlarında her zaman 113'ü arayın."},{q:"Aktivite arkadaşı nedir, nasıl denetlenir?",a:"Aktivite arkadaşı, yaşlıya kültür ve boş zaman aktivitelerinde eşlik eder — bireysel veya grupça, haftada ortalama 3–5 saat. 18 yaş ve üzeridir, görev öncesi adli sicil belgesi gösterir (belgeyi asla saklamayız, yalnız gösterildiğini kaydederiz) ve ortak ilgi ile kişiliğe göre eşleştirilir. Her eşleşmeyi bir insan onaylar; asla yalnız bir algoritma değil."},{q:"İstediğim zaman iptal edebilir miyim?",a:"Evet — gerekçesiz ve ek ücretsiz. Abonelik mevcut dönemin sonuna kadar sürer ve yenilenmez. Doğrudan ya da bize e-posta göndererek iptal edebilirsiniz."}]},finalCta:{h2:["Belirsizlik yarına","kalmasın"],lead:"İhtiyacını bugün bildir — size uyan zamanda belirler, eşleştirir ve takip ederiz.",placeholder:"eposta@adresin.com",btn:"Kaydol →",noBind:"Taahhüt yok · İstediğin zaman iptal",thanks:"Teşekkürler — kaydın alındı!",thanksSub:"Naviar Care'i kullanmaya başlayabileceğin anda sana e-posta göndereceğiz.",or:"Ya da hemen bir soruyla başla →"},footer:{tagline:"Pratik yardım. Sizin tercihlerinizle. Uzmanlar, hizmetler ve aile tek yerde.",area:"Pilot bölge: Drammen ve çevresi",col1:"Hizmet",col1Links:["Nasıl çalışır","Uzmanlık alanları","Fiyatlar","Uzmanlar için"],col2:"Şirket",col2Links:["Hakkımızda","Gizlilik","Kullanım koşulları","İletişim"],copyright:"© 2026 NAVIAR CARE · Drammen, Norveç",wipe:"Kayıtlı verileri sil",gdpr:"GDPR uyumlu · Veri işleme AB içinde"},cookie:{text:"Tercihlerini yalnız kendi tarayıcında saklarız. Tümünü kabul edersen site son baktıklarını da hatırlar — bir sonraki ziyaretin kaldığın yerden başlar. Tarayıcından dışarı hiçbir şey gönderilmez ve her şeyi istediğin an silebilirsin.",all:"Tümünü kabul et",necessary:"Yalnız gerekli",label:"Çerezler"},modal:{kicker:"İhtiyaç görüşmesi",title:"İhtiyacını bildir",lead:"İhtiyacı belirler ve bir iş günü içinde doğru yardımcıyla eşleştiririz.",name:"İsim *",namePh:"Adınız",email:"E-posta *",emailPh:"eposta@adresin.com",phone:"Telefon (isteğe bağlı)",phonePh:"+47 000 00 000",topic:"Hizmet",topicPh:"Hizmet seçin...",extraFaglig:"Uzman danışmanlığı (sağlık, hukuk, ekonomi)",extraHjelper:"Yardımcı olmak istiyorum",extraVetikke:"Henüz bilmiyorum",situation:"İhtiyacı tarif edin *",situationPh:'İhtiyacı yazın — teşhisi değil. Örn.: "Annemin Bergen\'de evde bakım başv
